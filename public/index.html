<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D12" />

    <!-- DNS prefetch for API domains to reduce TTFB -->
    <link rel="dns-prefetch" href="https://movienew.cybersoft.edu.vn" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts with font-display:swap to prevent render blocking (saves 120ms) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Primary Meta Tags -->
    <title>Cinefix — Đặt Vé Xem Phim Rạp Trực Tuyến Hàng Đầu</title>
    <meta name="title" content="Cinefix — Đặt Vé Xem Phim Rạp Trực Tuyến Hàng Đầu" />
    <meta
      name="description"
      content="Trải nghiệm điện ảnh đỉnh cao. Đặt vé xem phim chiếu rạp nhanh chóng, chọn vị trí ngồi đẹp nhất tại Cinefix với hàng trăm bộ phim bom tấn rạp và TMDB mới nhất."
    />
    <meta name="keywords" content="đặt vé xem phim, lịch chiếu phim, rạp chiếu phim, cinefix, rạp chiếu phim tphcm, vé phim giá rẻ" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cinefix-booking.vercel.app/" />

    <!-- Open Graph / Facebook / Zalo -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cinefix Cinema" />
    <meta property="og:url" content="https://cinefix-booking.vercel.app/" />
    <meta property="og:title" content="Cinefix — Đặt Vé Xem Phim Rạp Trực Tuyến Hàng Đầu" />
    <meta
      property="og:description"
      content="Trải nghiệm điện ảnh đỉnh cao. Đặt vé xem phim chiếu rạp nhanh chóng, chọn vị trí ngồi đẹp nhất tại Cinefix."
    />
    <meta property="og:image" content="https://cinefix-booking.vercel.app/img/cinefix-logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cinefix-booking.vercel.app/" />
    <meta name="twitter:title" content="Cinefix — Đặt Vé Xem Phim Rạp Trực Tuyến Hàng Đầu" />
    <meta
      name="twitter:description"
      content="Trải nghiệm điện ảnh đỉnh cao. Đặt vé xem phim chiếu rạp nhanh chóng tại Cinefix."
    />
    <meta name="twitter:image" content="https://cinefix-booking.vercel.app/img/cinefix-logo.png" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- JSON-LD Structured Data Schema for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MovieTheater",
        "name": "Cinefix Cinema",
        "url": "https://cinefix-booking.vercel.app/",
        "logo": "https://cinefix-booking.vercel.app/img/cinefix-logo.png",
        "description": "Hệ thống đặt vé xem phim rạp trực tuyến hàng đầu Việt Nam"
      }
    </script>
    <!-- Theme: apply dark class synchronously before first paint to prevent FOUC/CLS -->
    <script>
      (function () {
        try {
          var c = document.cookie.match(/app_theme_mode=([^;]+)/);
          var t = c ? c[1] : "dark";
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #0B0D12;">
    <noscript>Vui lòng bật JavaScript trên trình duyệt của bạn để có trải nghiệm tốt nhất trên Cinefix.</noscript>
    <div id="root"></div>
  </body>
</html>
